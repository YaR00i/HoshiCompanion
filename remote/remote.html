<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5f4d74">
<link rel="manifest" href="/manifest.webmanifest">
<title>Хоши</title>
<style>
  :root {
    --ink: #3b3449; --muted: #8b8198; --plum: #665479; --plum-2: #7d6894; --soft: #f1e9f5;
    --gold: #d2ae70; --paper: #fbf5f1; --card: #fffdfb; --line: #eadde3;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font: 15px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }

  header { padding: calc(14px + env(safe-area-inset-top)) 18px 14px; color: #fff;
    background: linear-gradient(155deg, #7a6590, #54456a); border-radius: 0 0 22px 22px; position: relative; }
  header h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: .3px; }
  header .status { margin-top: 3px; font-size: 13px; opacity: .9; display: flex; align-items: center; gap: 6px; min-height: 17px; }
  header .dot { width: 7px; height: 7px; border-radius: 50%; background: #bfe6b5; flex: none; }
  header .dot.off { background: #eaa7a7; }
  header .moon { position: absolute; right: 18px; top: calc(12px + env(safe-area-inset-top)); color: #f4dca8; font-size: 18px; letter-spacing: 5px; }

  main { padding: 14px 14px 8px; max-width: 520px; margin: 0 auto; }
  .tab { display: none; } .tab.active { display: block; }
  h2 { margin: 16px 4px 8px; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  h2:first-child { margin-top: 2px; }

  /* круглые быстрые кнопки */
  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; }
  .round { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .round .face { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 26px;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(80, 60, 100, .08); transition: transform .12s; }
  .round:active .face { transform: scale(.92); background: var(--soft); }

  /* плитки */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--line); font-size: 11px; color: var(--ink); min-height: 72px; text-align: center; }
  .tile .icon { font-size: 24px; line-height: 28px; }
  .tile img.icon, .appicon .face img { width: 30px; height: 30px; object-fit: contain; border-radius: 7px; }
  .tile:active { transform: scale(.95); background: var(--soft); }
  .tile.on { background: var(--plum); border-color: var(--plum); color: #fff; }
  .tile.off { opacity: .45; }
  .tile .note { font-size: 10px; color: var(--muted); }

  /* чипы режимов */
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  /* сценарии: ряд крупных кнопок на «Главном», листается вбок */
  .scenes { display: flex; gap: 8px; overflow-x: auto; margin: 12px -14px 0; padding: 2px 14px 4px; scrollbar-width: none; }
  .scenes::-webkit-scrollbar { display: none; }
  .scene { flex: none; display: flex; align-items: center; gap: 7px; padding: 10px 15px 10px 12px; border-radius: 16px;
    background: linear-gradient(135deg, var(--soft), var(--card)); border: 1px solid var(--line); font-weight: 600; font-size: 14px; color: var(--plum); }
  .scene .icon { font-size: 20px; }
  .scene.going { background: var(--plum); color: #fff; }
  /* таймер сна: полоска-напоминание и выбор на «Компьютере» */
  .timerbar { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border-radius: 16px;
    background: #2f2a45; color: #f3ecff; font-size: 14px; }
  .timerbar b { font-variant-numeric: tabular-nums; }
  .timerbar button { margin-left: auto; padding: 7px 13px; border-radius: 999px; background: rgba(255, 255, 255, .16); color: #fff; }
  .chip { padding: 8px 13px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
  .chip:active { background: var(--soft); }
  .chip.on { background: var(--plum); border-color: var(--plum); color: #fff; }

  /* карточка приложения */
  .app { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 12px;
    box-shadow: 0 3px 12px rgba(80, 60, 100, .07); }
  .app-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin: 0 2px 10px; }
  .now { display: flex; gap: 10px; align-items: center; }
  .thumb { width: 96px; height: 54px; border-radius: 10px; background: var(--soft) center/cover no-repeat; flex: none; }
  .now .text { min-width: 0; }
  .now .title { font-weight: 650; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .now .sub { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .progress { margin: 12px 2px 2px; }
  .bar { height: 6px; border-radius: 3px; background: var(--soft); position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--gold); }
  .bar.seekable { height: 8px; }
  .times { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 14px; margin-top: 8px; }
  .ctl { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 20px;
    background: var(--soft); color: var(--plum); }
  .ctl.big { width: 60px; height: 60px; font-size: 26px; background: var(--plum); color: #fff; }
  .ctl.small { width: 40px; height: 40px; font-size: 16px; background: transparent; border: 1px solid var(--line); }
  .ctl.on { background: #f7dfe7; color: #b04a6a; border-color: #f0c9d6; }
  .ctl:active { transform: scale(.92); }
  .extra { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
  details.list { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
  details.list summary { list-style: none; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
    font-size: 13px; font-weight: 650; color: var(--plum); padding: 6px 2px; }
  details.list summary::-webkit-details-marker { display: none; }
  details.list summary::after { content: "⌄"; margin-left: 8px; color: var(--muted); transition: transform .2s; }
  details.list[open] summary::after { transform: rotate(180deg); }
  details.list summary .count { margin-left: auto; font-weight: 500; color: var(--muted); font-size: 12px; }
  .item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 6px 4px; border-radius: 12px; }
  .item:active { background: var(--soft); }
  .item.current { background: var(--soft); }
  .item .mini { width: 80px; height: 45px; border-radius: 8px; flex: none; background: var(--soft) center/cover no-repeat; }
  .item .text { min-width: 0; display: flex; flex-direction: column; flex: 1; }
  .item .mini.fav { width: 28px; height: 28px; margin: 0 6px; background-size: contain; background-color: transparent;
    display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .item .acts { display: flex; gap: 4px; flex: none; }
  .item .acts button { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); font-size: 15px; }
  .list .more { width: 100%; margin-top: 6px; padding: 9px; border-radius: 12px; background: var(--soft); color: var(--plum); font-weight: 600; }
  .item .title { font-size: 13px; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .item .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.current .title::before { content: "▶ "; color: var(--gold); }
  .answer { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line);
    font-size: 13px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 45vh; overflow-y: auto; }
  .quick-replies { margin-top: 10px; }
  /* история бесед Claude — на весь экран */
  .history { position: fixed; inset: 0; z-index: 6; background: var(--paper); display: flex; flex-direction: column; }
  .history header { border-radius: 0; padding-bottom: 12px; }
  .history .hbar { display: flex; align-items: center; gap: 10px; }
  .history .hbar button { color: #fff; font-size: 20px; padding: 2px 8px; }
  .history .htitle { font-size: 16px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .history .hbody { flex: 1; overflow-y: auto; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
  .bubble { max-width: 88%; margin: 8px 0; padding: 9px 12px; border-radius: 16px; font-size: 14px; line-height: 1.4;
    white-space: pre-wrap; overflow-wrap: anywhere; }
  .bubble.assistant { background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .bubble.user, .bubble.phone { margin-left: auto; background: var(--plum); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.phone { background: #7d6894; }
  .bubble .when { display: block; font-size: 10px; opacity: .6; margin-top: 4px; }
  .bubble a { color: inherit; text-decoration: underline; }
  .sess { display: block; width: 100%; text-align: left; padding: 11px 12px; margin: 6px 0; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); }
  .sess.current { border-color: var(--plum); box-shadow: 0 0 0 1px var(--plum); }
  .sess b { display: block; font-size: 14px; } .sess span { font-size: 12px; color: var(--muted); }
  /* «Claude спрашивает»: разрешение или вопрос с вариантами */
  .ask { margin: 4px 0 10px; padding: 12px; border-radius: 16px; background: #fdf3e2; border: 1px solid #efd9b3; }
  .ask .ask-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #9a6b1f; margin-bottom: 6px; }
  .ask .detail { font: 12px/1.35 ui-monospace, Consolas, monospace; background: #fff; border: 1px solid #efd9b3; border-radius: 10px;
    padding: 8px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30vh; overflow-y: auto; }
  .ask .q { margin: 8px 0 4px; font-weight: 650; font-size: 14px; }
  .ask .opt { display: block; width: 100%; text-align: left; margin-top: 6px; padding: 9px 12px; border-radius: 12px;
    background: #fff; border: 1px solid #efd9b3; }
  .ask .opt.on { background: var(--plum); border-color: var(--plum); color: #fff; }
  .ask .opt small { display: block; font-size: 11px; opacity: .75; margin-top: 2px; }
  .ask input { width: 100%; margin-top: 6px; padding: 9px 12px; border-radius: 12px; border: 1px solid #efd9b3; font: inherit; }
  .ask .row { display: flex; gap: 8px; margin-top: 10px; }
  .ask .row button { flex: 1; padding: 11px; border-radius: 12px; font-weight: 650; background: #fff; border: 1px solid #efd9b3; }
  .ask .row .yes { background: #4caf7a; border-color: #4caf7a; color: #fff; }
  .ask .row .no { background: #8c3c52; border-color: #8c3c52; color: #fff; }
  .answer a { color: var(--plum); text-decoration: underline; overflow-wrap: anywhere; }
  .media-grid { display: grid; gap: 8px; margin-top: 10px; }
  .media-grid figure { margin: 0; }
  .media-grid img, .media-grid video { display: block; width: 100%; max-height: 50vh; object-fit: contain; border-radius: 12px;
    background: var(--soft); border: 1px solid var(--line); }
  .media-grid figcaption { font-size: 11px; color: var(--muted); margin-top: 3px; overflow-wrap: anywhere; }
  /* ряд иконок приложений: открыта одна карточка за раз */
  .appbar { display: flex; gap: 12px; overflow-x: auto; margin: 16px 2px 0; padding: 4px 2px; scrollbar-width: none; }
  .appbar:empty { display: none; }
  .appicon { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); width: 58px; }
  .appicon .face { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 24px; position: relative;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(80, 60, 100, .08); }
  .appicon.open .face { border-color: var(--plum); box-shadow: 0 0 0 2px var(--plum); }
  .appicon.open { color: var(--plum); font-weight: 600; }
  .appicon .mark { position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px;
    font-size: 11px; line-height: 18px; color: #fff; background: var(--gold); }
  .appicon .mark.done { background: #4caf7a; } .appicon .mark.waiting { background: #e0a33a; }
  .appicon.closed .face { opacity: .5; filter: grayscale(.6); }
  .appicon .name { max-width: 58px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .reply textarea { flex: 1; min-height: 44px; max-height: 30vh; resize: vertical; padding: 10px 12px; border-radius: 14px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); font: inherit; font-size: 14px; }
  .reply button { padding: 11px 16px; border-radius: 999px; background: var(--plum); color: #fff; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 18px 10px 4px; }

  /* вкладки */
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(255, 253, 251, .96);
    border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
  .pending { display: flex; align-items: center; gap: 10px; background: #fbe9ec; border: 1px solid #f0cdd5; color: #8c3c52;
    border-radius: 16px; padding: 10px 12px; margin-bottom: 12px; font-size: 13px; }
  .pending b { font-size: 15px; }
  .pending button { margin-left: auto; background: #8c3c52; color: #fff; border-radius: 999px; padding: 8px 14px; }
  .sheet { position: fixed; inset: 0; background: rgba(40, 30, 55, .35); display: grid; place-items: end center; z-index: 5; }
  .sheet-box { width: min(520px, 100%); background: var(--card); border-radius: 22px 22px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); text-align: center; }
  .sheet-icon { font-size: 34px; }
  .sheet-text { margin: 6px 0 16px; font-size: 16px; }
  .sheet-buttons { display: flex; gap: 10px; }
  .sheet-buttons button { flex: 1; padding: 13px; border-radius: 14px; background: var(--soft); }
  .sheet-buttons .danger { background: #8c3c52; color: #fff; }
  .tile.system .icon { filter: saturate(.6); }
  /* схема экранов, как в «Параметры → Дисплей» */
  .screens { position: relative; height: 130px; margin: 6px 0 4px; }
  .screens button { position: absolute; border: 2px solid #cdbdd6; background: var(--card); border-radius: 6px;
    font-weight: 700; color: var(--ink); display: grid; place-items: center; font-size: 15px; }
  .screens button.on { background: var(--plum); border-color: var(--plum); color: #fff; }
  /* «Окна» на главной: сетка иконок программ с подписями, листается */
  .wingrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 6px; max-height: 52vh; overflow-y: auto; padding: 4px 2px 2px; }
  .winicon { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--ink); min-width: 0; }
  .winicon .face { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; position: relative;
    background: var(--card); border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(80, 60, 100, .08); }
  .winicon .face.letter { font-size: 20px; font-weight: 700; color: #fff; }
  .winicon .screen { position: absolute; bottom: -5px; right: -5px; min-width: 17px; height: 17px; border-radius: 9px; padding: 0 3px;
    background: var(--plum); color: #fff; font-size: 10px; line-height: 17px; font-weight: 700; }
  .winicon .name { max-width: 100%; text-align: center; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
  .winicon .sub { color: var(--muted); font-size: 10px; }
  /* мини-плеер: над меню разделов, во всех разделах, пока что-то играет */
  .miniplayer { position: fixed; left: 8px; right: 8px; z-index: 3; max-width: 504px; margin: 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 6px 8px 8px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 4px 16px rgba(80, 60, 100, .16); overflow: hidden; }
  .miniplayer .cover { width: 44px; height: 44px; border-radius: 10px; flex: none; background: var(--soft) center/cover no-repeat;
    display: grid; place-items: center; font-size: 22px; }
  .miniplayer .text { flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left; }
  .miniplayer .title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .miniplayer .sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .miniplayer .btn { width: 38px; height: 38px; border-radius: 50%; flex: none; font-size: 16px; background: var(--soft); }
  .miniplayer .btn.main { background: var(--plum); color: #fff; width: 42px; height: 42px; }
  .miniplayer .line { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--gold); }
  body.with-mini { padding-bottom: calc(144px + env(safe-area-inset-bottom)); }
  nav button { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); padding: 2px 10px; border-radius: 12px; }
  nav button .icon { font-size: 19px; }
  nav button.active { color: var(--plum); background: var(--soft); }

  /* привязка */
  #pair { text-align: center; padding: 34px 20px; }
  #pair .hello { font-size: 20px; font-weight: 650; color: var(--plum); }
  #pair p { color: var(--muted); font-size: 14px; }
  #code { font-size: 30px; letter-spacing: 10px; text-align: center; width: 100%; max-width: 270px; padding: 12px;
    border: 2px solid var(--line); border-radius: 16px; background: #fff; color: var(--ink); }
  #pairButton { margin-top: 14px; padding: 13px 34px; border-radius: 999px; background: var(--plum); color: #fff; }
  .error { color: #b25b6d; min-height: 20px; margin-top: 10px; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: .92; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="moon">✦☾</div>
  <h1>Хоши</h1>
  <div class="status"><span class="dot off" id="dot"></span><span id="status">Подключаюсь…</span></div>
</header>

<main>
  <div id="pair" class="hidden">
    <div class="hello">Привет!</div>
    <p>Введи код, который Хоши показывает на компьютере<br>(меню → Пульт с телефона → Адрес и код)</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <br><button id="pairButton">Подружиться</button>
    <br><button id="scanButton" class="hidden" style="margin-top:12px;padding:11px 26px;border-radius:999px;background:var(--soft);color:var(--plum)">📷 Сканировать QR</button>
    <div class="error" id="pairError"></div>
  </div>

  <div id="remote" class="hidden">
    <section class="tab active" data-tab="main">
      <div class="quick" id="quick"></div>
      <div class="scenes hidden" id="scenes"></div>
      <div id="timerBox"></div>
      <div class="appbar" id="appbar"></div>
      <div id="sound"></div>
      <div class="app hidden" id="windowsPanel"></div>
      <div id="apps"></div>
    </section>
    <section class="tab" data-tab="play" id="playTab"></section>
    <section class="tab" data-tab="pc" id="pcTab"></section>
    <section class="tab" data-tab="modes" id="modesTab"></section>
  </div>
</main>

<div id="miniPlayer" class="miniplayer hidden"></div>
<nav id="nav" class="hidden">
  <button data-tab="main" class="active"><span class="icon">✦</span>Главное</button>
  <button data-tab="play"><span class="icon">☁️</span>Хоши</button>
  <button data-tab="pc"><span class="icon">💻</span>Компьютер</button>
  <button data-tab="modes"><span class="icon">⚙️</span>Режимы</button>
</nav>
<div class="toast" id="toast"></div>
<div class="sheet hidden" id="sheet"><div class="sheet-box">
  <div class="sheet-icon" id="sheetIcon"></div>
  <div class="sheet-text" id="sheetText"></div>
  <div class="sheet-buttons"><button id="sheetNo">Нет</button><button id="sheetYes" class="danger">Да</button></div>
</div></div>

<script>
// «Чёрный ящик»: ошибка скрипта — красной строкой на экране и в журнал Хоши (logs/session.log),
// чтобы было видно, почему пульт пустой (в приложении нет консоли браузера).
const pageErrors = [];
function reportError(text) {
  text = String(text).slice(0, 300); if (pageErrors.includes(text) || pageErrors.length > 5) return;
  pageErrors.push(text);
  let bar = document.getElementById("errorBar");
  if (!bar) { bar = document.createElement("div"); bar.id = "errorBar";
    bar.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:9;background:#b04a4a;color:#fff;font:12px/1.35 monospace;padding:8px;border-radius:10px;white-space:pre-wrap";
    document.body.append(bar); }
  bar.textContent = pageErrors.join("\n");
  try { if (typeof socket !== "undefined" && socket && socket.readyState === 1) socket.send(JSON.stringify({op: "page_error", text})); } catch (e) {}
}
window.addEventListener("error", (e) => reportError((e.message || "error") + " @" + (e.lineno || "?") + ":" + (e.colno || "?")));
window.addEventListener("unhandledrejection", (e) => reportError("promise: " + (e.reason && e.reason.message || e.reason)));
</script>
<script>
"use strict";
const WS_URL = `ws://${location.hostname}:18771/hoshi-remote-v1`;
let socket = null, token = null, catalog = {quick: [], groups: []}, state = {}, retry = 300;
// Связь переживает блокировку телефона: уходя в фон, страница сама закрывает её
// (Хоши сразу освобождает место), при возвращении мгновенно подключается снова,
// а нажатие во время переподключения не теряется.
let welcomed = false, lastHeard = 0, retryTimer = 0, offlineTimer = 0, queued = null;
try { token = localStorage.getItem("hoshi-token"); } catch (e) {}
// Ссылка из QR-кода: #pair=123456 — привязаться без ввода кода.
let linkCode = (location.hash.match(/pair=(\d{6})/) || [])[1] || "";
if (linkCode) history.replaceState(null, "", location.pathname);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; };

function toast(text) {
  const box = $("toast"); box.textContent = text; box.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => box.classList.remove("show"), 1500);
}
function send(message) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return false;
  socket.send(JSON.stringify(message)); return true;
}
function run(command, args) {
  const message = {op: "run", command, args: args || {}};
  if (!(welcomed && send(message))) { queued = {message, at: Date.now()}; wake(); }
  if (navigator.vibrate) navigator.vibrate(10);
}
function online(yes, text) {
  clearTimeout(offlineTimer);
  $("dot").classList.toggle("off", !yes); if (text !== undefined) $("status").textContent = text;
}
// Короткое переподключение не мигает надписью: точка тускнеет сразу, «не на связи» —
// только если связи нет дольше 4 секунд.
function softOffline() {
  $("dot").classList.add("off");
  clearTimeout(offlineTimer);
  offlineTimer = setTimeout(() => { $("status").textContent = "Хоши не на связи — жду…"; }, 4000);
}
function showPair(error) {
  $("remote").classList.add("hidden"); $("nav").classList.add("hidden"); $("miniPlayer").classList.add("hidden");
  $("pair").classList.remove("hidden"); $("pairError").textContent = error || "";
}
function showRemote() { $("pair").classList.add("hidden"); $("remote").classList.remove("hidden"); $("nav").classList.remove("hidden"); }

for (const tabButton of document.querySelectorAll("nav button")) {
  tabButton.addEventListener("click", () => {
    for (const b of document.querySelectorAll("nav button")) b.classList.toggle("active", b === tabButton);
    for (const t of document.querySelectorAll(".tab")) t.classList.toggle("active", t.dataset.tab === tabButton.dataset.tab);
    renderMini();
    window.scrollTo({top: 0});
  });
}

function connect() {
  if (document.hidden) return; // подключимся, когда страницу снова откроют
  clearTimeout(retryTimer);
  welcomed = false;
  const ws = new WebSocket(WS_URL);
  socket = ws;
  ws.onopen = () => {
    if (ws !== socket) return;
    retry = 300; lastHeard = Date.now();
    if (token) send({op: "hello", token});
    else if (linkCode) { send({op: "pair", code: linkCode}); linkCode = ""; }
    else showPair();
  };
  ws.onmessage = (event) => {
    if (ws !== socket) return;
    lastHeard = Date.now();
    let m; try { m = JSON.parse(event.data); } catch (e) { return; }
    // В приложении «Хоши» для Android: отдать ему ключ — фоновая служба держит связь, пока экран не на виду.
    // Отдельной строкой ДО цепочки if/else ниже, чтобы не «съесть» её ветки.
    if (m.op === "paired") token = m.token;
    if ((m.op === "paired" || m.op === "welcome") && token && window.HoshiApp) { try { window.HoshiApp.setToken(token); } catch (e) {} }
    if (m.op === "paired") { try { localStorage.setItem("hoshi-token", token); } catch (e) {} }
    else if (m.op === "welcome" || m.op === "catalog") {
      catalog = m.catalog || catalog; showRemote(); renderHoshi(); renderPc(); renderSound(); renderBar();
      if (m.op === "welcome") {
        welcomed = true;
        // Нажатие, сделанное пока связь восстанавливалась, уходит сразу (если ему < 5 с).
        if (queued && Date.now() - queued.at < 5000) send(queued.message);
        queued = null;
        if (openApp === "windows") send({op: "run", command: "pc:windows", args: {}}); // «Окна» открыты — свежий список
      }
    }
    else if (m.op === "state") { state = m; online(true, (m.hoshi && m.hoshi.status) || "На связи"); renderHoshi(); renderSound(); renderApps(); renderPending(); renderWindows(); renderMini(); renderTimer();
      // Приложению — что сейчас включено (звук, режимы), чтобы плитки и кнопки горели правильно.
      if (window.HoshiApp && window.HoshiApp.onState) { try { window.HoshiApp.onState(JSON.stringify({sound: (m.sound || {}).current || "", selected: (m.hoshi || {}).selected || []})); } catch (e) {} } }
    else if (m.op === "history") showHistory(m);
    else if (m.op === "ran" && !m.ok) toast({not_allowed: "С телефона так нельзя", missing: "Не нашла этот файл на компьютере",
      nothing_to_cancel: "Нечего отменять", need_confirm: "Нужно подтвердить",
      not_available: "Это устройство сейчас не на связи",
      not_waiting: "Claude сейчас не ждёт ответа — напиши, когда он закончит", unknown_session: "Эта сессия Claude уже закрыта",
      unknown_window: "Этого окна уже нет — обнови список", bad_screen: "Выбери экран",
      no_question: "Вопрос уже закрыт — Claude спросит на ПК", not_all_answered: "Ответь на все вопросы",
      unknown_scene: "Этого сценария уже нет", bad_minutes: "Столько минут нельзя", empty_scene: "В сценарии нет шагов — добавь их на ПК"}[m.reason] || "Сейчас не получилось");
    else if (m.op === "error") {
      if (m.reason === "need_pairing") {
        token = null; try { localStorage.removeItem("hoshi-token"); } catch (e) {}
        if (linkCode) { send({op: "pair", code: linkCode}); linkCode = ""; } else showPair();
      }
      else if (m.reason === "bad_code") showPair("Код не подошёл — посмотри на экран компьютера");
      else if (m.reason === "too_fast") toast("Помедленнее :)");
    }
  };
  ws.onclose = () => {
    if (ws !== socket) return;
    socket = null; welcomed = false; softOffline();
    if (!document.hidden) { retryTimer = setTimeout(connect, retry); retry = Math.min(retry * 1.6, 5000); }
  };
}

function dropSocket() {
  const ws = socket; socket = null; welcomed = false;
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
}

// Страница снова на экране (разблокировали телефон, вернулись во вкладку, появилась сеть).
function wake() {
  if (document.hidden) return;
  retry = 300;
  if (socket && socket.readyState === WebSocket.OPEN) {
    // Связь может выглядеть живой, но умереть во сне: проверяем, ответит ли Хоши.
    const asked = Date.now(); send({op: "ping"});
    setTimeout(() => { if (socket && lastHeard < asked) { dropSocket(); softOffline(); connect(); } }, 1500);
  } else if (!socket || socket.readyState !== WebSocket.CONNECTING) {
    connect();
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) { clearTimeout(retryTimer); dropSocket(); }
  else wake();
});
window.addEventListener("pageshow", wake);
window.addEventListener("online", wake);
window.addEventListener("focus", wake);
// Пульс, пока пульт на экране: замечает зависшую связь.
setInterval(() => {
  if (document.hidden || !socket || socket.readyState !== WebSocket.OPEN) return;
  if (Date.now() - lastHeard > 9000) { dropSocket(); softOffline(); connect(); return; }
  send({op: "ping"});
}, 4000);

function selected() { return new Set((state.hoshi && state.hoshi.selected) || []); }

function renderHoshi() {
  const on = selected();
  const key = JSON.stringify([catalog.quick, catalog.groups, catalog.scenes, [...on]]);
  if (renderHoshi.key === key) return; // ничего не поменялось — не трогаем страницу
  renderHoshi.key = key;
  const quick = $("quick"); quick.textContent = "";
  for (const item of catalog.quick || []) {
    const b = el("button", "round"); const face = el("span", "face", item.icon || "✦");
    b.append(face, el("span", "", item.title)); b.onclick = () => run(item.command); quick.append(b);
  }
  // Сценарии (собираются на ПК): одна кнопка — несколько шагов по очереди.
  const scenes = $("scenes"); scenes.textContent = "";
  scenes.classList.toggle("hidden", !(catalog.scenes || []).length);
  for (const item of catalog.scenes || []) {
    const b = el("button", "scene"); b.append(el("span", "icon", item.icon || "✨"), el("span", "", item.title));
    b.onclick = () => {
      run(item.command); toast("Сценарий «" + item.title + "»…");
      b.classList.add("going"); setTimeout(() => b.classList.remove("going"), 1500 + 900 * (item.steps || 1));
    };
    scenes.append(b);
  }
  for (const tab of ["play", "modes"]) {
    const root = $(tab + "Tab"); root.textContent = "";
    for (const group of (catalog.groups || []).filter((g) => g.tab === tab)) {
      root.append(el("h2", "", group.title));
      const box = el("div", tab === "play" ? "tiles" : "chips");
      for (const item of group.commands) {
        let b;
        if (tab === "play") { b = el("button", "tile"); b.append(el("span", "icon", item.icon || "✦"), el("span", "", item.title)); }
        else b = el("button", "chip", (item.confirm && item.icon ? item.icon + " " : "") + item.title);
        if (on.has(item.command)) b.classList.add("on");
        b.onclick = () => item.confirm ? confirmThen(item) : run(item.command); box.append(b);
      }
      root.append(box);
    }
  }
}

// Вкладка «Компьютер»: мои действия (задаются на ПК) и системные кнопки.
function renderPc() {
  const root = $("pcTab"); root.textContent = "";
  root.append(el("div", "", "")); root.lastChild.id = "pendingBox";
  root.append(el("div", "", "")); root.lastChild.id = "pcTimerBox";
  const items = catalog.pc || [];
  const mine = items.filter((i) => !i.system), system = items.filter((i) => i.system);
  root.append(el("h2", "", "Мои действия"));
  if (!mine.length) root.append(el("div", "empty", "Добавь программы, папки и ссылки на компьютере: меню Хоши → Пульт с телефона → Мои действия"));
  else root.append(tiles(mine));
  if (system.length) { root.append(el("h2", "", "Компьютер")); root.append(tiles(system)); }
  renderTimerSetup(root);
  if (window.HoshiApp && window.HoshiApp.getQuickActions) renderQuickSetup(root);
  renderPending();
}
// «Быстрые кнопки телефона» (только в приложении «Хоши» для Android): до 3 кнопок в
// уведомлении (видно на экране блокировки) и до 6 плиток в шторке. Выбор — из того,
// что уже есть на пульте; «опасные» (с «Точно?») не предлагаются. Хранит приложение.
function quickCandidates() {
  const out = [];
  for (const i of catalog.scenes || []) out.push({command: i.command, title: i.title, icon: i.icon || "✨"});
  for (const i of catalog.sound || []) out.push({command: i.command, title: i.title, icon: i.icon || "🔊"});
  if (catalog.timer) {
    for (const m of [30, 60]) out.push({command: "timer:" + m, title: "Сон " + m + " мин", icon: "🌙"});
    out.push({command: "timer:cancel", title: "Отменить сон", icon: "☀️"});
  }
  for (const i of (catalog.pc || []).filter((x) => !x.confirm)) out.push({command: i.command, title: i.title, icon: i.icon || "🚀"});
  for (const i of catalog.quick || []) out.push({command: i.command, title: i.title, icon: i.icon || "✦"});
  for (const g of catalog.groups || []) for (const i of g.commands) if (!i.confirm && !out.some((o) => o.command === i.command))
    out.push({command: i.command, title: i.title, icon: i.icon || "✦"});
  return out;
}
function renderQuickSetup(root) {
  let saved = {notify: [], tiles: []};
  try { saved = JSON.parse(window.HoshiApp.getQuickActions()); } catch (e) {}
  const box = el("div", "app"); box.append(el("div", "app-head", "📱 Быстрые кнопки телефона"));
  const save = () => { try { window.HoshiApp.setQuickActions(JSON.stringify(saved)); } catch (e) {} };
  const section = (key, title, max, hint) => {
    box.append(el("h2", "", title + " · " + saved[key].length + "/" + max));
    const chosen = el("div", "chips");
    for (const item of saved[key]) {
      const c = el("button", "chip on", item.icon + " " + item.title + "  ✕");
      c.onclick = () => { saved[key] = saved[key].filter((x) => x.command !== item.command); save(); renderPc(); };
      chosen.append(c);
    }
    if (!saved[key].length) chosen.append(el("span", "empty", hint));
    box.append(chosen);
    const pick = el("details", "list"); const summary = el("summary", ""); summary.append(el("span", "", "＋ Добавить"));
    pick.append(summary);
    const options = el("div", "chips");
    for (const item of quickCandidates()) {
      if (saved[key].some((x) => x.command === item.command)) continue;
      const c = el("button", "chip", item.icon + " " + item.title);
      c.onclick = () => { if (saved[key].length >= max) { toast("Уже " + max + " — убери одну"); return; } saved[key].push(item); save(); renderPc(); };
      options.append(c);
    }
    pick.append(options); box.append(pick);
  };
  section("notify", "В уведомлении и на экране блокировки", 3, "Пусто — выбери до 3 кнопок");
  section("tiles", "Плитки в шторке «Хоши 1…6»", 6, "Пусто — выбери до 6; потом добавь плитки в шторке через «Изменить»");
  root.append(box);
}

// Значок кнопки: настоящий значок программы (с ПК), иначе смайлик.
function iconOf(item, fallback) {
  if (item.icon_url) { const img = el("img", "icon"); img.src = item.icon_url; img.alt = ""; return img; }
  return el("span", "icon", item.icon || fallback);
}

function tiles(items) {
  const box = el("div", "tiles");
  for (const item of items) {
    const b = el("button", "tile" + (item.system ? " system" : ""));
    b.append(iconOf(item, "🚀"), el("span", "", item.title));
    b.onclick = () => launchAction(item);
    box.append(b);
  }
  return box;
}
// Нажатие на «Моё действие»: спросить «Точно?» / «Где открыть?» или сразу выполнить.
function launchAction(item) {
  if (item.confirm) confirmThen(item);
  else if (item.ask_place) placeThen(item);
  else run(item.command);
}
// Схема экранов: прямоугольники в раскладке Windows (x, y, ширина, высота), с номерами.
function screenMap(monitors, selected, onPick) {
  const map = el("div", "screens");
  if (!monitors.length) return map;
  const left = Math.min(...monitors.map((m) => m.x)), top = Math.min(...monitors.map((m) => m.y));
  const right = Math.max(...monitors.map((m) => m.x + m.width)), bottom = Math.max(...monitors.map((m) => m.y + m.height));
  const width = right - left, height = bottom - top;
  // Та же пропорция, что у настоящей раскладки: сузить по ширине или по высоте.
  const box = Math.min(1, (height / width) / (130 / 300));
  for (const m of monitors) {
    const b = el("button", m.index === selected ? "on" : "", m.index + (m.primary ? " ★" : ""));
    b.style.left = (50 - 50 * box + 100 * box * (m.x - left) / width) + "%";
    b.style.width = "calc(" + (100 * box * m.width / width) + "% - 4px)";
    b.style.top = (100 * (m.y - top) / height) + "%";
    b.style.height = "calc(" + (100 * m.height / height) + "% - 4px)";
    b.onclick = () => { for (const other of map.children) other.classList.toggle("on", other === b); onPick(m.index); };
    map.append(b);
  }
  return map;
}
// Выбор «экран + положение» в листке снизу; done(monitor, mode, front) — по кнопке.
// extra — {front: true} (показать переключатель «Поверх других окон»), onFront() — «Показать поверх».
function placeSheet(icon, question, monitors, modesList, monitor, mode, allowAsIs, button, done, extra) {
  extra = extra || {};
  let front = true; try { front = localStorage.getItem("hoshi-front") !== "0"; } catch (e) {}
  const sheet = el("div", "sheet"); const box = el("div", "sheet-box");
  box.append(el("div", "sheet-icon", icon), el("div", "sheet-text", question));
  const asIs = el("div", "chips"); asIs.style.justifyContent = "center";
  const map = screenMap(monitors, monitor, (index) => { monitor = index; redraw(); });
  const modes = el("div", "chips"); modes.style.justifyContent = "center"; modes.style.margin = "10px 0 16px";
  const redraw = () => {
    for (const c of asIs.children) c.classList.toggle("on", monitor === 0);
    for (const c of map.children) c.classList.toggle("on", c.textContent.split(" ")[0] === String(monitor));
    for (const c of modes.children) c.classList.toggle("on", c.dataset.value === mode);
  };
  if (allowAsIs) { const c = el("button", "chip", "Как само откроется"); c.onclick = () => { monitor = 0; redraw(); }; asIs.append(c); }
  for (const [value, label] of Object.entries(modesList || {})) {
    const c = el("button", "chip", label); c.dataset.value = value; c.onclick = () => { mode = value; redraw(); }; modes.append(c);
  }
  const extras = el("div", "chips"); extras.style.justifyContent = "center"; extras.style.marginBottom = "14px";
  if (extra.front) {
    const toggle = el("button", "chip" + (front ? " on" : ""), "⬆ Поверх других окон");
    toggle.onclick = () => { front = !front; toggle.classList.toggle("on", front); try { localStorage.setItem("hoshi-front", front ? "1" : "0"); } catch (e) {} };
    extras.append(toggle);
  }
  if (extra.onFront) {
    const show = el("button", "chip", "👁 Показать поверх, не двигая");
    show.onclick = () => { sheet.remove(); extra.onFront(); };
    extras.append(show);
  }
  const buttons = el("div", "sheet-buttons"); const no = el("button", "", "Отмена"); const yes = el("button", "danger", button);
  no.onclick = () => sheet.remove();
  yes.onclick = () => { if (!allowAsIs && !monitor) { toast("Выбери экран"); return; } sheet.remove(); done(monitor, mode, front); };
  sheet.onclick = (e) => { if (e.target === sheet) sheet.remove(); };
  buttons.append(no, yes); box.append(asIs, map, modes);
  if (extras.children.length) box.append(extras);
  box.append(buttons); sheet.append(box); document.body.append(sheet); redraw();
}
// «Где открыть?»: экран и положение — только из списка, который прислал ПК.
function placeThen(item) {
  const ask = item.ask_place;
  placeSheet(item.icon || "🚀", item.title + " — где открыть?", ask.monitors || [], ask.modes, ask.monitor || 0, ask.mode || "center",
    true, "Открыть", (monitor, mode) => run(item.command, {monitor, mode}));
}
// Раздел «Окна»: открытые окна ПК (имя программы, экран) — переставить на другой экран.
const WIN_ICONS = {chrome: "🌐", msedge: "🌐", firefox: "🦊", "mpc-be64": "🎬", claude: "✳️", chatgpt: "💬", explorer: "📁", notepad: "📝", steamwebhelper: "🎮", telegram: "✈️", discord: "🎧"};
// Цвет «буквы» для программ без своей иконки — всегда один и тот же для имени.
function letterColor(name) {
  const colors = ["#7a6590", "#c07a5a", "#5a8fa8", "#6aa27a", "#b56a8f", "#8a7ac0", "#c29a4a"];
  let sum = 0; for (const ch of name) sum += ch.charCodeAt(0);
  return colors[sum % colors.length];
}
// Панель «Окна» на главной (иконка 🖥️ в ряду приложений): открытые окна ПК иконками
// с подписями; нажал — выбрать экран на схеме и положение.
function renderWindows() {
  const box = $("windowsPanel"); if (!box) return;
  const w = state.windows || {};
  const key = JSON.stringify(w);
  if (renderWindows.key === key) return;
  renderWindows.key = key; box.textContent = "";
  const head = el("div", "app-head"); head.append(el("span", "", "Окна"));
  const refresh = el("button", "chip", "↻"); refresh.title = "Обновить"; refresh.onclick = () => { run("pc:windows"); toast("Смотрю окна…"); };
  head.append(refresh); box.append(head);

// Ряд иконок: Звук и приложения (YouTube, MPC-BE, Claude…). Нажал — раскрылась
// только его карточка; ещё раз — свернулась. Выбор помнит телефон.
const APP_ICONS = {sound: "🔊", windows: "🖥️", youtube: "▶️", mpc: "🎬", claude: "✳️", codex: "⌨️", tabs: "📑"};
const APP_TITLES = {tabs: "Вкладки", youtube: "YouTube", mpc: "MPC-BE", claude: "Claude", codex: "Codex"};
let openApp = null;
try { openApp = localStorage.getItem("hoshi-open-app"); } catch (e) {}
function barItems() {
  const items = [];
  if ((catalog.sound || []).length) items.push({id: "sound", title: "Звук"});
  items.push({id: "windows", title: "Окна"});
  for (const app of state.apps || []) {
    const s = app.state || {}; let mark = "", kind = "";
    if (app.id === "claude") {
      if (s.ask) { mark = "?"; kind = "waiting"; }
      else if (s.subtitle === "работает…") mark = "…";
      else if (String(s.subtitle || "").startsWith("⚠")) { mark = "!"; kind = "waiting"; }
      else if (String(s.subtitle || "").startsWith("?")) { mark = "?"; kind = "waiting"; }
      else if (s.can_reply) { mark = "✓"; kind = "done"; }
    } else if (s.playing) mark = "▶";
    const action = (catalog.pc || []).find((a) => a.app === app.id && a.icon_url); // настоящий значок, если приложение есть в «Моих действиях»
    items.push({id: app.id, title: app.title, mark, kind, icon_url: action && action.icon_url});
  }
  // Закрытые приложения, у которых есть запуск в «Моих действиях», — серые иконки.
  const running = new Set(items.map((i) => i.id));
  for (const action of catalog.pc || []) {
    if (!action.app || running.has(action.app)) continue;
    running.add(action.app);
    items.push({id: action.app, title: APP_TITLES[action.app] || action.title, launch: action, closed: true, icon_url: action.icon_url});
  }
  return items;
}
function renderBar() {
  const bar = $("appbar"); const items = barItems();
  const ids = items.map((i) => i.id);
  // Открытое приложение закрылось — открыть то, где что-то происходит, иначе первое.
  const open = items.filter((i) => !i.closed);
  // Открытое приложение закрылось — открыть то, где что-то происходит, иначе первое.
  // Только что запущенное (серое) ждём: его карточка откроется, когда оно появится.
  if (openApp !== "" && !ids.includes(openApp)) openApp = (open.find((i) => i.mark) || open[0] || {}).id || null;
  const key = JSON.stringify([items, openApp]);
  if (renderBar.key !== key) {
    renderBar.key = key; bar.textContent = "";
    for (const item of items) {
      const b = el("button", "appicon" + (item.id === openApp && !item.closed ? " open" : "") + (item.closed ? " closed" : ""));
      const face = el("span", "face", item.icon_url ? "" : (APP_ICONS[item.id] || "▣"));
      if (item.icon_url) { const img = el("img"); img.src = item.icon_url; img.alt = ""; face.append(img); }
      if (item.mark) face.append(el("span", "mark " + item.kind, item.mark));

      b.onclick = () => {
        if (item.closed) { // закрыто — запустить; когда появится, откроется его карточка
          launchAction(item.launch); if (!item.launch.ask_place) toast("Запускаю " + item.title + "…"); openApp = item.id;
          try { localStorage.setItem("hoshi-open-app", openApp); } catch (e) {}
          return;
        }
        openApp = openApp === item.id ? "" : item.id; // ещё раз — свернуть
        if (openApp === "windows") run("pc:windows"); // открыли «Окна» — свежий список
        try { localStorage.setItem("hoshi-open-app", openApp); } catch (e) {}

// Мини-плеер внизу (в любом разделе): что играет — YouTube, MPC-BE, видео во вкладке.
// Поставил на паузу — остаётся ещё 10 минут, чтобы можно было продолжить.
// Несколько играют — ⇄ переключает. Нажал на название — открывается полная карточка.
const MINI_KEEP_MS = 10 * 60 * 1000;
const miniSeen = {};      // id -> {since: когда заиграло, last: когда последний раз играло}
let miniChoice = null;    // выбранный кнопкой ⇄
function miniCandidates() {
  const apps = (state.apps || []).filter((a) => a.id !== "claude" && (a.commands || []).some((c) => c.command.endsWith(":toggle")) && (a.state || {}).title);
  const youtube = apps.find((a) => a.id === "youtube" && a.state.playing);
  const now = Date.now();
  const list = [];
  for (const app of apps) {
    const s = app.state;
    // YouTube уже есть своей карточкой — та же вкладка в «Вкладках Chrome» не дублируется.
    if (app.id === "tabs" && youtube && String(s.subtitle || "").startsWith("youtube.com")) continue;
    const seen = miniSeen[app.id] = miniSeen[app.id] || {since: 0, last: 0};
    if (s.playing) { if (!seen.playing) seen.since = now; seen.last = now; }
    seen.playing = !!s.playing;
    if (s.playing || now - seen.last < MINI_KEEP_MS) list.push(app);
  }
  return list.sort((a, b) => (b.state.playing - a.state.playing) || miniSeen[b.id].since - miniSeen[a.id].since);
}
function miniCommand(app, name) { return (app.commands || []).find((c) => c.command.endsWith(":" + name)); }
function renderMini() {
  const box = $("miniPlayer");
  const mainTab = document.querySelector("nav button.active");
  const onMain = mainTab && mainTab.dataset.tab === "main";
  const list = miniCandidates().filter((a) => !(onMain && openApp === a.id)); // открытая карточка и так на виду
  const app = list.find((a) => a.id === miniChoice) || list[0];
  const show = !!app && !$("remote").classList.contains("hidden");
  box.classList.toggle("hidden", !show);
  document.body.classList.toggle("with-mini", show);
  if (!show) return;
  box.style.bottom = ($("nav").offsetHeight + 8) + "px";
  const s = app.state;
  const key = JSON.stringify([app.id, s.title, s.subtitle, s.thumbnail, list.length, app.commands.map((c) => c.command)]);
  if (box.dataset.key !== key) {
    box.dataset.key = key; box.textContent = "";
    const cover = el("span", "cover", s.thumbnail ? "" : (APP_ICONS[app.id] || "▶️"));
    if (s.thumbnail) cover.style.backgroundImage = `url("${String(s.thumbnail).replace(/"/g, "")}")`;
    const text = el("button", "text");
    text.append(el("span", "title", s.title), el("span", "sub", (APP_TITLES[app.id] || app.title) + (s.subtitle ? " · " + s.subtitle : "")));
    text.onclick = () => {
      document.querySelector('nav button[data-tab="main"]').click();
      openApp = app.id; try { localStorage.setItem("hoshi-open-app", openApp); } catch (e) {}
      renderBar(); renderMini();
    };
    box.append(cover, text);
    for (const name of ["back", "toggle", "forward"]) {
      const c = miniCommand(app, name); if (!c) continue;
      const b = el("button", "btn" + (name === "toggle" ? " main" : ""), c.icon || "•");
      b.dataset.name = name; b.dataset.icon = c.icon || "•"; b.setAttribute("aria-label", c.title);
      b.onclick = () => run(c.command, c.args);
      box.append(b);
    }
    if (list.length > 1) {
      const swap = el("button", "btn", "⇄"); swap.setAttribute("aria-label", "Другой плеер");
      swap.onclick = () => { const at = list.findIndex((a) => a.id === app.id); miniChoice = list[(at + 1) % list.length].id; renderMini(); };
      box.append(swap);
    }
    box.append(el("span", "line"));
  }
  const toggle = box.querySelector('[data-name="toggle"]');
  if (toggle) toggle.textContent = (s.icons || {}).toggle || (s.playing ? "⏸" : "▶");
  box.querySelector(".line").style.width = s.duration > 0 ? Math.min(100, 100 * (s.time || 0) / s.duration) + "%" : "0";
}

// Ссылки http(s) в тексте — нажимаются и открываются в браузере телефона.
function linkify(node, text) {
  const parts = String(text).split(/(https?:\/\/[^\s<>"'`)\]]+)/g);
  parts.forEach((part, i) => {
    if (i % 2) { const a = el("a", "", part); a.href = part; a.target = "_blank"; a.rel = "noopener noreferrer"; node.append(a); }
    else if (part) node.append(document.createTextNode(part));
  });
}

function clock(s) {
  if (!isFinite(s) || s < 0) return "";
  s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0");
}

// Карточки приложений. Полностью перестраиваются, только когда меняется
// состав (видео, кнопки, списки); время, прогресс и иконки обновляются на месте,
// чтобы раскрытые списки не сворачивались и не мигали.
const appViews = {};      // id -> {signature, card, fill, times, buttons}
const openLists = {};     // "app:list" -> раскрыт ли список
const drafts = {};        // app id -> недописанный ответ (Claude), переживает перестройку карточки
const askDrafts = {};     // id вопроса -> {вопрос: ответ}

function renderApps() {
  const root = $("apps");
  const apps = state.apps || [];
  if (!apps.length) {
    root.textContent = ""; for (const k in appViews) delete appViews[k];
    if (!(catalog.sound || []).length)
      root.append(el("div", "empty", "Когда откроешь YouTube в Chrome с расширением Хоши, плеер MPC-BE или начнёт работать Claude, здесь появятся их пульты"));
    renderBar();
    return;
  }
  const alive = new Set(apps.map((a) => a.id));
  for (const id in appViews) if (!alive.has(id)) { appViews[id].card.remove(); delete appViews[id]; }
  // Карточки не вынимаем из страницы без нужды: иначе окошко ответа Claude и сама
  // страница теряют прокрутку при каждом обновлении (время плеера — раз в секунду).
  for (const node of [...root.children]) if (!Object.values(appViews).some((v) => v.card === node)) node.remove();
  let previous = null;
  for (const app of apps) {
    const s = app.state || {};
    const signature = JSON.stringify([app.commands, s.title, s.subtitle, s.thumbnail, s.hint, s.lists, s.text, s.can_reply, s.session, s.media,
      s.ask ? s.ask.id : ""]); // таймер вопроса не перестраивает карточку — выбор не сбрасывается
    let view = appViews[app.id];
    if (!view || view.signature !== signature) {
      const fresh = buildApp(app, signature);
      const scroll = view && view.card.querySelector(".answer");
      const kept = scroll ? scroll.scrollTop : 0;
      if (view) view.card.replaceWith(fresh.card);
      view = appViews[app.id] = fresh;
      const again = view.card.querySelector(".answer");
      if (again && kept) again.scrollTop = kept;
    }
    updateApp(view, app);
    const place = previous ? previous.nextSibling : root.firstChild;
    if (view.card !== place) root.insertBefore(view.card, place);
    previous = view.card;
    view.card.dataset.app = app.id;
  }
  renderBar();
}

function buildApp(app, signature) {
  const s = app.state || {};
  const view = {signature, buttons: {}};
  const card = el("div", "app"); view.card = card;
  const head = el("div", "app-head"); view.playing = el("span", "");
  head.append(el("span", "", app.title), view.playing); card.append(head);
  if (s.title) {
    const now = el("div", "now");
    if (s.thumbnail) { const thumb = el("div", "thumb"); thumb.style.backgroundImage = `url("${String(s.thumbnail).replace(/"/g, "")}")`; now.append(thumb); }
    const text = el("div", "text"); text.append(el("div", "title", s.title)); if (s.subtitle) text.append(el("div", "sub", s.subtitle));
    now.append(text); card.append(now);
  } else card.append(el("div", "empty", s.hint || "Ничего не играет"));
  const byName = {}; for (const c of app.commands) byName[c.command.split(":")[2]] = c;
  if (app.id === "claude") { // история бесед (решение 27.09): текущая беседа и все сессии
    const hist = el("div", "chips"); hist.style.margin = "2px 0 8px";
    const talk = el("button", "chip", "💬 Беседа"); talk.onclick = () => openHistory("read", s.session || "");
    const all = el("button", "chip", "🗂 Все сессии"); all.onclick = () => openHistory("sessions", "");
    hist.append(talk, all); card.insertBefore(hist, card.children[1] || null);
  }
  if (s.ask && byName.permit) { card.insertBefore(buildAsk(s.ask, byName, view), card.children[1] || null); }
  if (s.text) { const answer = el("div", "answer"); linkify(answer, s.text); card.append(answer); }
  // Картинки, гифки и видео из ответа: Хоши отдаёт их по случайному адресу /media/<id>.
  if ((s.media || []).length) {
    const grid = el("div", "media-grid");
    for (const m of s.media) {
      const src = "/media/" + encodeURIComponent(m.id); const fig = el("figure");
      if (m.kind === "video") { const v = el("video"); v.controls = true; v.preload = "metadata"; v.playsInline = true; v.src = src; fig.append(v); }
      else { const link = el("a"); link.href = src; link.target = "_blank"; link.rel = "noopener";
        const img = el("img"); img.src = src; img.alt = m.name; img.loading = "lazy"; link.append(img); fig.append(link); }
      fig.append(el("figcaption", "", m.name)); grid.append(fig);
    }
    card.append(grid);
  }
  // Быстрые кнопки Claude видны всегда; живые — только пока Claude ждёт ответа.
  if (byName.reply && !s.can_reply) {
    const quick = el("div", "chips quick-replies");
    for (const label of ["👋 Ты тут?", "▶ Продолжай", "✓ Ок", "💾 Коммить"]) {
      const chip = el("button", "chip", label); chip.disabled = true; chip.style.opacity = ".45"; quick.append(chip);
    }
    card.append(quick);
    if (!s.hint && !s.ask) card.append(el("div", "empty", s.subtitle === "работает…" ? "Claude работает — кнопки оживут, когда закончит"
      : "Claude не ждёт ответа — напиши ему в сессии на ПК, потом кнопки оживут"));
  }
  // Ответ Claude с телефона: поле есть, только пока Claude ждёт (его хук на связи).
  if (s.can_reply && byName.reply) {
    const box = el("div", "reply"); const input = el("textarea"); const send = el("button", "", "Отправить");
    input.placeholder = "Ответить Claude…"; input.maxLength = 2000; input.value = drafts[app.id] || "";
    input.addEventListener("input", () => { drafts[app.id] = input.value; });
    send.onclick = () => {
      const text = input.value.trim(); if (!text) return;
      run(byName.reply.command, {text, session: s.session});
      drafts[app.id] = ""; input.value = ""; toast("Отправила Claude");
    };
    // Быстрые ответы: «!» — пинг (Claude отвечает одной строкой, ничего не начиная; см. CLAUDE.md).
    const quick = el("div", "chips quick-replies");
    // «💾 Коммить» — единственная кнопка, которая разрешает локальный коммит (правило в CLAUDE.md).
    for (const [label, text] of [["👋 Ты тут?", "!"], ["▶ Продолжай", "Продолжай"], ["✓ Ок", "Ок"], ["💾 Коммить", "💾 Коммить (кнопка пульта)"]]) {
      const chip = el("button", "chip", label);
      chip.onclick = () => { run(byName.reply.command, {text, session: s.session}); toast("Отправила Claude"); };
      quick.append(chip);
    }
    card.append(quick);
    box.append(input, send); card.append(box);
  }
  if (s.title) {
    const prog = el("div", "progress"); const bar = el("div", "bar"); view.fill = el("i"); bar.append(view.fill);
    if (byName.seek_to) {
      bar.classList.add("seekable");
      bar.onclick = (e) => { const r = bar.getBoundingClientRect(); const d = view.duration || 0;
        if (d > 0) run(byName.seek_to.command, {time: Math.round(d * (e.clientX - r.left) / r.width)}); };
    }
    view.times = el("div", "times"); view.times.append(el("span"), el("span"));
    prog.append(bar, view.times); card.append(prog); view.progress = prog;
  }
  const main = el("div", "controls"), extra = el("div", "extra");
  for (const c of app.commands) {
    const name = c.command.split(":")[2];
    if (c.row === "hidden") continue;
    const isMain = c.row === "main";
    const b = el("button", "ctl " + (name === "toggle" ? "big" : (isMain ? "" : "small")), c.icon || "•");
    b.title = c.title; b.setAttribute("aria-label", c.title); b.dataset.icon = c.icon || "•";
    b.onclick = () => run(c.command, c.args);
    view.buttons[name] = b;
    (isMain || name === "toggle" ? main : extra).append(b);
  }
  card.append(main); if (extra.children.length) card.append(extra);
  for (const list of s.lists || []) {
    const key = app.id + ":" + list.id;
    const box = el("details", "list"); box.open = !!openLists[key];
    // list.request — список приходит только по нажатию (вкладки браузера): открыл — попросили.
    const ask = list.request && byName[list.request];
    box.addEventListener("toggle", () => {
      openLists[key] = box.open;
      if (box.open && ask && !list.items.length) run(ask.command, {});
    });
    const summary = el("summary", "");
    summary.append(el("span", "", list.title), el("span", "count", list.position || String(list.items.length)));
    box.append(summary);
    for (const item of list.items) {
      // С кнопками в строке (item.actions) строка — не <button>: кнопка в кнопке не работает.
      const acts = (Array.isArray(item.actions) ? item.actions : Array.isArray(list.actions) ? list.actions : []).filter((a) => a && byName[a.name]);
      const row = el(acts.length ? "div" : "button", "item" + (item.current ? " current" : ""));
      const t = el("span", "mini" + (list.small_icons ? " fav" : ""), list.small_icons && !item.thumbnail ? "🌐" : ""); if (item.thumbnail) t.style.backgroundImage = `url("${String(item.thumbnail).replace(/"/g, "")}")`;
      const text = el("span", "text"); text.append(el("span", "title", item.title));
      if (item.subtitle) text.append(el("span", "sub", item.subtitle));
      row.append(t, text);
      if (byName.play_item && !item.current) {
        row.onclick = () => { run(byName.play_item.command, {id: item.id, list: item.list || ""}); toast(list.open_text || "Включаю…"); };
        if (acts.length) row.setAttribute("role", "button");
      }
      if (acts.length) {
        const bar = el("span", "acts");
        for (const a of acts) {
          const b = el("button", "", a.icon || "•"); b.title = a.title || a.name; b.setAttribute("aria-label", b.title);
          b.onclick = (event) => {
            event.stopPropagation();
            if (a.confirm && !confirm(a.confirm)) return;
            run(byName[a.name].command, {id: item.id});
          };
          bar.append(b);
        }
        row.append(bar);
      }
      box.append(row);
    }
    if (ask && !list.items.length) {
      const more = el("button", "more", list.request_title || "Показать"); more.onclick = () => run(ask.command, {});
      box.append(more);
    }
    card.append(box);
  }
  return view;
}

// «Claude спрашивает»: разрешение (Разрешить / Запретить, с кодом) или вопрос с вариантами.
function buildAsk(ask, byName, view) {
  const box = el("div", "ask"); const head = el("div", "ask-head");
  view.askTimer = el("span", "", "");
  head.append(el("span", "", ask.kind === "permission" ? "Claude просит разрешение · " + ask.id : "Claude спрашивает"), view.askTimer);
  box.append(head);
  if (ask.kind === "permission") {
    box.append(el("div", "", ask.tool || "Действие"));
    if (ask.detail) box.append(el("div", "detail", ask.detail));
    const row = el("div", "row"); const no = el("button", "no", "✕ Запретить"); const yes = el("button", "yes", "✓ Разрешить");
    no.onclick = () => { run(byName.permit.command, {id: ask.id, behavior: "deny"}); toast("Запретила"); };
    yes.onclick = () => confirmThen({icon: "✓", title: "Разрешить «" + (ask.tool || "действие") + "» · код " + ask.id,
      command: byName.permit.command, args: {id: ask.id, behavior: "allow"}});
    row.append(no, yes); box.append(row);
    return box;
  }
  const answers = askDrafts[ask.id] = askDrafts[ask.id] || {};
  const send = el("button", "yes", "Отправить ответ");
  const refresh = () => { send.disabled = ask.questions.some((q) => !answers[q.question]); send.style.opacity = send.disabled ? ".5" : "1"; };
  for (const q of ask.questions) {
    if (q.header) box.append(el("div", "ask-head", q.header));
    box.append(el("div", "q", q.question));
    const picked = new Set(String(answers[q.question] || "").split(", ").filter(Boolean));
    const buttons = [];
    for (const o of q.options) {
      const b = el("button", "opt" + (picked.has(o.label) ? " on" : ""), o.label);
      if (o.description) b.append(el("small", "", o.description));
      b.onclick = () => {
        if (q.multiSelect) { picked.has(o.label) ? picked.delete(o.label) : picked.add(o.label); }
        else { picked.clear(); picked.add(o.label); other.value = ""; }
        for (const x of buttons) x.classList.toggle("on", picked.has(x.firstChild.textContent));
        answers[q.question] = [...picked].join(", "); refresh();
      };
      buttons.push(b); box.append(b);
    }
    const other = el("input"); other.placeholder = "Другое — свой ответ…"; other.maxLength = 500;
    other.oninput = () => {
      if (other.value.trim()) { picked.clear(); for (const x of buttons) x.classList.remove("on"); answers[q.question] = other.value.trim(); }
      else answers[q.question] = "";
      refresh();
    };
    box.append(other);
  }
  send.onclick = () => { if (send.disabled) return; run(byName.answer.command, {id: ask.id, answers}); toast("Ответила Claude"); };
  const row = el("div", "row"); row.append(send); box.append(row); refresh();
  return box;
}

// Экран истории: беседа (пузыри) или список сессий. Данные приходят {op: "history"}.
let historyView = null;
function openHistory(kind, session) {
  if (!historyView) {
    historyView = el("div", "history"); const head = el("header"); const bar = el("div", "hbar");
    const back = el("button", "", "←"); historyView.titleEl = el("div", "htitle", "");
    const close = el("button", "", "✕"); bar.append(back, historyView.titleEl, close); head.append(bar);
    historyView.body = el("div", "hbody"); historyView.append(head, historyView.body);
    back.onclick = () => historyView.kind === "read" ? openHistory("sessions", "") : (historyView.remove());
    close.onclick = () => historyView.remove();
  }
  historyView.kind = kind; historyView.titleEl.textContent = kind === "read" ? "Беседа" : "Все сессии Claude";
  historyView.body.textContent = ""; historyView.body.append(el("div", "empty", "Загружаю…"));
  document.body.append(historyView);
  send({op: "history", kind, session});
}
function showHistory(m) {
  if (!historyView || !historyView.isConnected || m.kind !== historyView.kind) return;
  const body = historyView.body; body.textContent = "";
  if (!m.ok) { body.append(el("div", "empty", m.kind === "read" ? "Беседа не найдена — открой «Все сессии»" : "Не получилось прочитать сессии")); return; }
  if (m.kind === "sessions") {
    if (!m.sessions.length) body.append(el("div", "empty", "Сессий пока нет"));
    for (const x of m.sessions) {
      const b = el("button", "sess" + (x.current ? " current" : ""));
      b.append(el("b", "", x.title), el("span", "", x.folder + " · " + new Date(x.updated * 1000).toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})));
      b.onclick = () => openHistory("read", x.id);
      body.append(b);
    }
    return;
  }
  historyView.titleEl.textContent = m.title || "Беседа";
  if (!m.messages.length) body.append(el("div", "empty", "Сообщений пока нет"));
  for (const msg of m.messages) {
    const bubble = el("div", "bubble " + msg.role); linkify(bubble, (msg.role === "phone" ? "📱 " : "") + msg.text);
    const when = msg.time ? new Date(msg.time + "Z") : null;
    if (when && !isNaN(when)) bubble.append(el("span", "when", when.toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"})));
    body.append(bubble);
  }
  body.scrollTop = body.scrollHeight; // к последнему сообщению
}

function updateApp(view, app) {
  const s = app.state || {}, icons = s.icons || {}, active = new Set(s.active || []);
  if (view.askTimer && s.ask) view.askTimer.textContent = s.ask.seconds + " с";
  view.playing.textContent = s.badge !== undefined ? s.badge : (s.playing ? "▶ играет" : (s.title ? "⏸ пауза" : ""));
  view.duration = s.duration || 0;
  if (view.progress) {
    view.progress.classList.toggle("hidden", !(s.duration > 0));
    view.fill.style.width = s.duration > 0 ? Math.min(100, 100 * (s.time || 0) / s.duration) + "%" : "0";
    view.times.children[0].textContent = clock(s.time); view.times.children[1].textContent = clock(s.duration);
  }
  for (const name in view.buttons) {
    const b = view.buttons[name];
    b.textContent = icons[name] || b.dataset.icon;
    b.classList.toggle("on", active.has(name));
  }
}

// В приложении «Хоши» для Android — сканер QR (адрес и код из окна «Пульт с телефона»).
if (window.HoshiApp && window.HoshiApp.scanQr) {
  $("scanButton").classList.remove("hidden");
  $("scanButton").onclick = () => window.HoshiApp.scanQr();
}
$("pairButton").addEventListener("click", () => {
  const code = $("code").value.replace(/\D/g, "");
  if (code.length !== 6) { $("pairError").textContent = "Нужно 6 цифр"; return; }
  send({op: "pair", code});
});
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pairButton").click(); });
connect();
