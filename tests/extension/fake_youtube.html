<!doctype html>
<html><head><meta charset="utf-8"><title>Lo-fi для рисования — 1 час - YouTube</title></head>
<body>
<!-- Упрощённая копия разметки YouTube для проверки youtube.js без сети. -->
<div id="movie_player">
  <video class="html5-main-video"></video>
  <button class="ytp-mute-button" onclick="window.__v.muted = !window.__v.muted">mute</button>
  <button class="ytp-next-button" onclick="window.__nextClicks = (window.__nextClicks || 0) + 1">next</button>
</div>
<ytd-watch-metadata>
  <h1><yt-formatted-string>Lo-fi для рисования — 1 час</yt-formatted-string></h1>
  <ytd-channel-name><a href="#">Hoshi Radio</a></ytd-channel-name>
  <like-button-view-model><button aria-pressed="false"
    onclick="this.setAttribute('aria-pressed', this.getAttribute('aria-pressed') === 'true' ? 'false' : 'true')">like</button></like-button-view-model>
</ytd-watch-metadata>
<div id="primary"><div id="related">
  <ytd-compact-video-renderer><a id="thumbnail" href="/watch?v=nextAAA1111"></a>
    <span id="video-title" title="Дождь за окном и джаз">Дождь за окном и джаз</span><ytd-channel-name>Cozy Sounds</ytd-channel-name></ytd-compact-video-renderer>
  <yt-lockup-view-model><a class="thumb" href="/watch?v=nextBBB2222&amp;pp=x"></a>
    <a href="/watch?v=nextBBB2222" title="Как рисовать аниме-глаза">Как рисовать аниме-глаза</a>
    <span class="yt-content-metadata-view-model-wiz__metadata-text">Art School</span></yt-lockup-view-model>
  <ytd-compact-video-renderer><a id="thumbnail" href="/watch?v=abcDEF12345"></a><span id="video-title">то же самое видео</span></ytd-compact-video-renderer>
</div></div>
<ytd-playlist-panel-renderer id="playlist">
  <div id="header-description"><h3>Музыка для работы</h3></div>
  <ytd-playlist-panel-video-renderer><a href="/watch?v=listAAA0001&amp;list=PLhoshi"></a><span id="video-title">Первое</span><span id="byline">Hoshi Radio</span></ytd-playlist-panel-video-renderer>
  <ytd-playlist-panel-video-renderer selected><a href="/watch?v=abcDEF12345&amp;list=PLhoshi"></a><span id="video-title">Lo-fi для рисования — 1 час</span><span id="byline">Hoshi Radio</span></ytd-playlist-panel-video-renderer>
  <ytd-playlist-panel-video-renderer><a id="third" href="/watch?v=listCCC0003&amp;list=PLhoshi"></a><span id="video-title">Третье</span><span id="byline">Hoshi Radio</span></ytd-playlist-panel-video-renderer>
</ytd-playlist-panel-renderer>
<script>
  // Рекомендации под видео продолжаются дальше первых 12 карточек.
  const related = document.querySelector("#related");
  for (let i = 1; i <= 18; i++) {
    const card = document.createElement("ytd-compact-video-renderer");
    card.innerHTML = `<a href="/watch?v=more${String(i).padStart(7, "0")}"></a><span id="video-title">Ещё видео ${i}</span>`;
    related.append(card);
  }
  // Переходы по ссылкам в тесте не выполняем, а запоминаем.
  window.__clicked = [];
  document.addEventListener("click", (e) => { const a = e.target.closest("a"); if (a) { e.preventDefault(); window.__clicked.push(a.getAttribute("href")); } });
  // Настоящее видео не нужно: подменяем свойства плеера управляемыми значениями.
  const v = document.querySelector("video");
  window.__v = v;
  let paused = true, time = 42, volume = 0.5, muted = false;
  Object.defineProperty(v, "paused", { get: () => paused });
  Object.defineProperty(v, "ended", { get: () => false });
  Object.defineProperty(v, "duration", { get: () => 3600 });
  Object.defineProperty(v, "currentTime", { get: () => time, set: (x) => { time = x; } });
  Object.defineProperty(v, "volume", { get: () => volume, set: (x) => { volume = x; } });
  Object.defineProperty(v, "muted", { get: () => muted, set: (x) => { muted = x; } });
  v.play = () => { paused = false; v.dispatchEvent(new Event("play")); return Promise.resolve(); };
  v.pause = () => { paused = true; v.dispatchEvent(new Event("pause")); };
</script>
</body></html>
